org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.enableJetifier=true

# Force Gradle to use Android Studio's bundled 64-bit JDK instead of
# whatever "java" happens to be on PATH. Without this, Gradle picked up a
# 32-bit Java 8 install here, which can't reserve the 2GB heap above and
# is too old for compileOptions VERSION_21 anyway.
# Adjust the path below if your Android Studio is installed elsewhere,
# or if `java -version` under it reports a different folder name than "jbr".
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
